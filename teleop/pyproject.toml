[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dexremo-teleop"
version = "0.1.0"
description = "DexRemo hand: servo driver, calibration and leader-follower teleoperation"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "pyserial", "feetech-servo-sdk"]

[project.optional-dependencies]
viewer = ["mujoco>=3.0"]
# Recording also needs LeRobot 0.4 or later (pip install lerobot), not listed here so that
# an existing LeRobot install is not replaced.
record = ["mujoco>=3.0", "opencv-python"]

[project.scripts]
dexremo-teleop = "dexremo_teleop.cli:main"

[tool.setuptools]
packages = ["dexremo_teleop"]
